<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wjxing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 56px 64px;
      max-width: 560px;
      width: 90%;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
    }

    .greeting {
      font-size: 13px;
      color: #999;
      margin-bottom: 20px;
    }

    .avatar {
      width: 140px;
      height: 196px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .role {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 2px;
      margin-bottom: 28px;
    }

    .bio {
      font-size: 15px;
      line-height: 1.8;
      color: #444;
      margin-bottom: 32px;
    }

    .counter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f5f5f0;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      color: #888;
    }

    .counter-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #667eea;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .counter-num {
      font-weight: 600;
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="greeting" id="greeting"></div>
    <div class="avatar"><img src="个人照片/me.png" alt="wjxing" /></div>
    <h1>wjxing</h1>
    <div class="role">Sales</div>
    <div class="divider"></div>
    <p class="bio">
      你好，我是 wjxing，一名有着丰富经验的销售从业者。我热衷于与人沟通、建立信任，擅长挖掘客户需求并提供切实可行的解决方案。无论是陌生拜访还是长期维护，我始终以真诚和专业赢得每一位客户的认可。在我看来，销售不只是成交，更是一段值得长久经营的关系。
    </p>
    <div class="counter">
      <span class="counter-dot"></span>
      您是第 <span class="counter-num" id="visit-count">...</span> 位访客
    </div>
  </div>

  <script>
    const hour = new Date().getHours();
    const greetingEl = document.getElementById('greeting');
    if (hour < 12) greetingEl.textContent = '☀️ 早上好，欢迎来访';
    else if (hour < 18) greetingEl.textContent = '🌤 下午好，欢迎来访';
    else greetingEl.textContent = '🌙 晚上好，欢迎来访';

    fetch('https://api.countapi.xyz/hit/wjxing-bot.github.io/visits')
      .then(r => r.json())
      .then(data => {
        document.getElementById('visit-count').textContent = data.value.toLocaleString();
      })
      .catch(() => {
        document.getElementById('visit-count').textContent = '–';
      });
  </script>
</body>
</html>
