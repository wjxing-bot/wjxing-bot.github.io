<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wjxing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 56px 64px;
      max-width: 560px;
      width: 90%;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      font-weight: 600;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .role {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 2px;
      margin-bottom: 28px;
    }

    .bio {
      font-size: 15px;
      line-height: 1.8;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">W</div>
    <h1>wjxing</h1>
    <div class="role">Sales</div>
    <div class="divider"></div>
    <p class="bio">
      你好，我是 wjxing，一名有着丰富经验的销售从业者。我热衷于与人沟通、建立信任，擅长挖掘客户需求并提供切实可行的解决方案。无论是陌生拜访还是长期维护，我始终以真诚和专业赢得每一位客户的认可。在我看来，销售不只是成交，更是一段值得长久经营的关系。
    </p>
  </div>
</body>
</html>
